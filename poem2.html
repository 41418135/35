    <!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烏衣巷 - 劉禹錫</title>
    
    <!-- 匯入外部樣式設定 (連結到剛剛建立的 poem2.css) -->
    <link rel="stylesheet" href="poem2.css">
</head>
<body>

    <!-- 詩的標題 -->
    <h1 class="title">烏衣巷</h1>

    <!-- 頁面中央的劉禹錫畫像 (請在資料夾準備一張名為 liuyuxi.jpg 的圖片) -->
    <!-- 這裡預設先放一張網路上的圖取代，考試若有規定圖檔，請將src改為你準備的圖檔名稱 -->
    <img src="liuyuxi.jpg" alt="劉禹錫畫像" class="author-img">

    <!-- 詩的內容 -->
    <div class="content">
        <p>作者：劉禹錫</p>
        <p>
            朱雀橋邊野草花，<br>
            烏衣巷口夕陽斜。<br>
            舊時王謝堂前燕，<br>
            飛入尋常百姓家。
        </p>
    </div>

</body>
</html>
