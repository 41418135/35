<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>將進酒 - 李白</title>
    <style>
        /* 網頁內嵌式樣式設定 */
        
        /* 1. 整頁背景設為粉紅色，並將內容置中 */
        body {
            background-color: pink;
            text-align: center; 
        }

        /* 2. 詩的標題設為: 藍色、40點字 */
        .title {
            color: blue;
            font-size: 40pt;
            margin-top: 20px;
        }

        /* 2. 詩的內容設為: 綠色、30點字 */
        .content {
            color: green;
            font-size: 30pt;
            line-height: 1.5; /* 增加行距讓排版更易讀 */
        }

        /* 3. 頁面中央放1楨李白的畫像圖 */
        .author-img {
            width: 300px; /* 長或寬為300px */
            border: 5px solid purple; /* 深紫色圖框線(5px) */
            border-radius: 50px; /* 四周做成圓角(半徑50px) */
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <!-- 詩的標題 -->
    <h1 class="title">將進酒</h1>

    <!-- 頁面中央的李白畫像 (請在資料夾準備一張名為 libai.jpg 的圖片) -->
    <!-- 這裡預設先放一張網路上的圖取代，確保畫面能夠順利顯示，若老師有給圖，請將src改為該圖檔名稱 -->
    <img src="libai.jpg" alt="李白畫像" class="author-img">
    
    <!-- 詩的內容 -->
    <div class="content">
        <p>作者：李白</p>
        <p>
            君不見，黃河之水天上來，奔流到海不復回。<br>
            君不見，高堂明鏡悲白髮，朝如青絲暮成雪。<br>
            人生得意須盡歡，莫使金樽空對月。<br>
            天生我材必有用，千金散盡還復來。<br>
            烹羊宰牛且為樂，會須一飲三百杯。<br>
            岑夫子，丹丘生，將進酒，杯莫停。<br>
            與君歌一曲，請君為我傾耳聽。<br>
            鐘鼓饌玉不足貴，但願長醉不復醒。<br>
            古來聖賢皆寂寞，惟有飲者留其名。<br>
            陳王昔時宴平樂，斗酒十千恣歡謔。<br>
            主人何為言少錢，徑須沽取對君酌。<br>
            五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。
        </p>
    </div>

</body>
</html>
